<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f1f4f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="manifest" href="manifest.webmanifest">

<link rel="icon" href="icon-180.png">
<style>
@font-face{font-family:"Sofia Sans Extra Condensed";src:url(fonts/sofia-cyr.woff2) format("woff2");font-weight:700 900;font-display:swap;unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Sofia Sans Extra Condensed";src:url(fonts/sofia-lat.woff2) format("woff2");font-weight:700 900;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Golos Text";src:url(fonts/golos-cyr.woff2) format("woff2");font-weight:400 600;font-display:swap;unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Golos Text";src:url(fonts/golos-lat.woff2) format("woff2");font-weight:400 600;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --track:#b8432b; --track-deep:#8f2f1c; --field:#1f6b4a; --field-deep:#14503a; --flag:#f2c230;
  --paper:#f1f4f6; --card:#fff; --ink:#15181a; --ink2:#4a5157; --line:#d2d8dd; --cold:#c1c8cd;
  --disp:"Sofia Sans Extra Condensed","Arial Narrow",sans-serif;
  --ui:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0}
html{background:var(--paper);-webkit-text-size-adjust:100%}
body{font:400 16px/1.4 var(--ui);color:var(--ink);font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
::selection{background:var(--track);color:#fff}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
body[data-phase] :focus-visible{outline-color:var(--fg)}
input{caret-color:var(--track)}
svg{display:block}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- обычные экраны ---------- */
.page{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 96px)}
h1{font:900 56px/.92 var(--disp);text-transform:uppercase;letter-spacing:-.01em;text-wrap:balance}
h2{font:900 30px/1 var(--disp);text-transform:uppercase;margin:36px 0 12px;padding-top:14px;border-top:3px solid var(--ink)}
.sub{color:var(--ink2);margin-top:8px}
.muted{color:var(--ink2)}
.small{font-size:14px}
.rows{list-style:none;padding:0}
.rows>li{padding:12px 0;border-bottom:1px solid var(--line)}
.rows>li:first-child{border-top:1px solid var(--line)}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.row b{font-weight:600}
.row .v{white-space:nowrap;color:var(--ink2)}
.up{color:var(--track-deep);font-weight:600}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:12px;background:var(--card);border:2px solid var(--ink);font-weight:600;transition:transform .15s var(--ease)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--track);border-color:var(--track);color:#fff;min-height:68px;font:900 30px/1 var(--disp);text-transform:uppercase;letter-spacing:.02em}
.btn.ghost{border-color:var(--line);font-weight:500}
.btn.on{background:var(--ink);color:#fff}
.btns.stack>*{flex-basis:100%}
.btns.stack .danger{margin-top:18px}
.ed [data-a=rm]{margin-left:10px}
summary .row .v{margin-left:auto}
.btn.danger{border-color:var(--track);color:var(--track-deep)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btns>*{flex:1 1 140px}
.seg{display:flex;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{flex:1;min-height:46px;padding:0 6px;font-weight:500;font-size:15px}
.seg button+button{border-left:2px solid var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
select{width:100%;min-height:52px;padding:0 14px;border-radius:12px;border:2px solid var(--ink);background:var(--card);font-weight:500}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:3px solid var(--ink);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:500;color:var(--ink2)}
.tabs button[aria-current=page]{color:var(--track-deep);font-weight:600}
.note{padding:12px 0;border-bottom:1px solid var(--line)}
.note b{font-weight:600}
.ed{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.ed .sq{width:44px;height:44px;border:2px solid var(--ink);border-radius:10px;display:grid;place-items:center;background:var(--card)}
.ed .n{min-width:74px;text-align:center;font-weight:600}
.ed select{flex:1 1 150px;min-height:44px;width:auto}
details>summary{cursor:pointer;list-style:none;padding:12px 0}
details>summary::-webkit-details-marker{display:none}
details>summary .row::after{content:"";width:9px;height:9px;border-right:2.2px solid var(--ink);border-bottom:2.2px solid var(--ink);transform:rotate(45deg);flex:none;align-self:center;transition:transform .2s var(--ease)}
details[open]>summary .row::after{transform:rotate(-135deg)}
details .in{padding:0 0 14px}
.sets{color:var(--ink2);font-size:15px;text-align:right}
.chart{margin-top:12px}
.chart svg{width:100%;height:auto;overflow:visible}
.chart text{font:400 11px var(--ui);fill:var(--ink2)}
.chart .val{font-weight:600;fill:var(--ink)}
.tip{min-height:22px;font-size:14px;color:var(--ink2);margin-top:4px}
.bar{height:8px;background:var(--line);border-radius:4px;margin-top:8px;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--track)}
.bar u{position:absolute;top:-3px;bottom:-3px;border-left:2px solid var(--ink);border-right:2px solid var(--ink);opacity:.35}
.figs{display:flex;justify-content:center;gap:12px;margin:8px 0 4px}
.figs figure{flex:1;max-width:170px;text-align:center}
.figs figcaption{font-size:13px;color:var(--ink2);margin-top:4px}
.figs svg{width:100%;height:auto}
.scale{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);margin:10px 0 0}
.scale i{flex:1;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--cold),var(--track))} /* taste-skill-ignore: легенда шкалы нагрузки, градиент кодирует данные */
.score{display:flex;align-items:flex-end;gap:14px;margin-top:8px}
.score .n{font:900 148px/.76 var(--disp);letter-spacing:-.02em;color:var(--track)}
.score .w{font:900 34px/1 var(--disp);text-transform:uppercase;padding-bottom:4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;margin-top:20px}
.stats div{padding:10px 0;border-top:1px solid var(--line)}
.stats b{display:block;font:900 40px/1 var(--disp)}
.stats span{font-size:14px;color:var(--ink2)}

/* ---------- полоса тренировки ---------- */
.strip{display:flex;gap:2px;height:16px;padding:3px;border-radius:6px;background:var(--ink)}
.strip i{min-width:2px;border-radius:2px;background:#fff}
.strip i.r{background:#49b384}.strip i.o{background:var(--flag)}.strip i.n{background:#ffffff2e}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-top:6px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;background:#fff;border:1px solid var(--ink)}
.legend .r::before{background:#49b384}.legend .o::before{background:var(--flag)}

/* ---------- экран тренировки ---------- */
body[data-phase=set]{--bg:var(--track);--fg:#fff;--fg2:#fff1ec;--btn:#fff;--btnfg:var(--track-deep);--rule:#ffffff73}
body[data-phase=rest]{--bg:var(--field);--fg:#fff;--fg2:#d6f0e2;--btn:#fff;--btnfg:var(--field-deep);--rule:#ffffff73}
body[data-phase=over]{--bg:var(--flag);--fg:var(--ink);--fg2:#3a3208;--btn:var(--ink);--btnfg:#fff;--rule:#15181a66}
.wk{min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);transition:background-color .4s,color .4s;
  padding:calc(env(safe-area-inset-top) + 14px) 20px calc(env(safe-area-inset-bottom) + 18px)}
.wk.wipe{animation:wipe .55s var(--ease)}
@keyframes wipe{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0)}}
.wk ::selection{background:var(--fg);color:var(--bg)}
.wk .top{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px;color:var(--fg2);padding-bottom:10px;border-bottom:3px solid var(--fg)}
.wk .top button{width:44px;height:44px;display:grid;place-items:center;margin-right:-10px;color:var(--fg)}
.wk .head{display:flex;gap:14px;align-items:flex-end;margin-top:20px}
.wk .num{font:900 128px/.76 var(--disp);letter-spacing:-.02em}
.wk .ex{font:900 44px/.92 var(--disp);text-transform:uppercase;text-wrap:balance;overflow-wrap:anywhere}
.wk .ex.long{font-size:34px}
.wk .head>div:last-child{min-width:0}
.wk .meta{color:var(--fg2);margin-top:6px;font-size:15px}
.wk .last{display:flex;justify-content:space-between;gap:12px;margin-top:18px;padding:10px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);font-size:15px}
.wk .last span:last-child{text-align:right}
.stp{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
.stp button{width:72px;height:72px;border-radius:50%;border:3px solid var(--fg);display:grid;place-items:center;flex:none;transition:background-color .15s,transform .15s var(--ease)}
.stp button:active{background:var(--rule);transform:scale(.94)}
.stp .ic{width:30px;height:30px;stroke-width:3}
.stp label{flex:1;text-align:center;font-size:14px;color:var(--fg2)}
.stp input{display:block;width:100%;border:0;background:none;text-align:center;color:var(--fg);caret-color:var(--fg);font:900 104px/.86 var(--disp);padding:0;border-radius:8px;-moz-appearance:textfield}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none}
.wk .go{margin-top:auto;min-height:76px;border-radius:14px;background:var(--btn);color:var(--btnfg);font:900 34px/1 var(--disp);text-transform:uppercase;letter-spacing:.02em;transition:transform .15s var(--ease)}
.wk .go:active{transform:scale(.97)}
.wk .foot{margin-top:16px}
.wk .cap{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--fg2);margin-top:8px}
.wk .clock{font:900 168px/.8 var(--disp);letter-spacing:-.02em;margin-top:28px;white-space:nowrap}
.wk .clock.long{font-size:132px}
.wk .state{font:900 44px/1 var(--disp);text-transform:uppercase;margin-top:24px}
.wk .next{margin-top:26px;padding:14px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);font-size:17px}
.wk .next b{font-weight:600}
.wk .sec{display:flex;gap:10px;margin:22px 0 14px}
.wk .sec button{flex:1;min-height:52px;border-radius:12px;border:2px solid var(--fg);font-weight:600}
.wk .sec button:active{background:var(--rule)}

/* ---------- диалоги ---------- */
dialog{border:0;border-radius:18px 18px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom) + 20px);width:100%;max-width:520px;margin:auto auto 0;background:var(--card);color:var(--ink)}
dialog::backdrop{background:#15181a99}
dialog[open]{animation:sheet .35s var(--ease)}
@keyframes sheet{from{transform:translateY(40px);opacity:0}}
dialog h3{font:900 30px/1 var(--disp);text-transform:uppercase;margin-bottom:14px}
dialog .col{display:grid;gap:10px}
dialog input,textarea{width:100%;min-height:56px;border:2px solid var(--ink);border-radius:12px;padding:0 14px;font-size:20px;font-weight:600;background:var(--card)}
.toast{position:fixed;left:20px;right:20px;bottom:calc(env(safe-area-inset-bottom) + 84px);margin:0 auto;max-width:440px;background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;text-align:center;animation:sheet .3s var(--ease);z-index:5}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-height:860px){.wk .head{margin-top:28px}.stp{margin-top:26px}}
@media (max-height:700px){.wk .num{font-size:96px}.stp input{font-size:80px}.stp button{width:60px;height:60px}.wk .clock{font-size:128px}.stp{margin-top:10px}}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<script>
'use strict';
/* ================= справочники ================= */
const MUS={chest:'Грудь',lats:'Широчайшие',traps:'Трапеции и верх спины',delts:'Плечи',rear:'Задние дельты',biceps:'Бицепс',triceps:'Трицепс',forearms:'Предплечья',abs:'Пресс',lower:'Поясница',glutes:'Ягодицы',quads:'Квадрицепс',hams:'Бицепс бедра',calves:'Икры'};
// m: вклад в мышцы (1 основная, .5 вспомогательная); bw: с весом тела; c: тяжёлое базовое; st: шаг веса; w0: стартовый вес
const EX={
  pullup:{n:'Подтягивания',m:{lats:1,biceps:.5,traps:.5,forearms:.5},bw:1,c:1,st:2.5,w0:0},
  dips:{n:'Брусья',m:{chest:1,triceps:1,delts:.5},bw:1,c:1,st:2.5,w0:0},
  bench:{n:'Жим лёжа',m:{chest:1,triceps:.5,delts:.5},c:1,st:2.5,w0:40},
  incline_db:{n:'Жим гантелей на наклонной',m:{chest:1,delts:.5,triceps:.5},st:2,w0:14},
  pec_deck:{n:'Бабочка',m:{chest:1},st:5,w0:30},
  lat_pull:{n:'Тяга верхнего блока',m:{lats:1,biceps:.5},st:5,w0:45},
  cable_row:{n:'Тяга горизонтального блока',m:{lats:1,traps:1,biceps:.5,rear:.5},st:5,w0:40},
  db_row:{n:'Тяга гантели в наклоне',m:{lats:1,traps:.5,biceps:.5,rear:.5},st:2,w0:18},
  ohp_db:{n:'Жим гантелей сидя',m:{delts:1,triceps:.5},c:1,st:2,w0:12},
  lateral:{n:'Махи гантелями в стороны',m:{delts:1},st:1,w0:7},
  rear_fly:{n:'Обратная бабочка',m:{rear:1,traps:.5},st:5,w0:20},
  face_pull:{n:'Тяга каната к лицу',m:{rear:1,traps:.5},st:2.5,w0:15},
  ez_curl:{n:'Подъём штанги на бицепс',m:{biceps:1,forearms:.5},st:2.5,w0:20},
  hammer:{n:'Молотки',m:{biceps:1,forearms:1},st:1,w0:10},
  incline_curl:{n:'Сгибания на наклонной скамье',m:{biceps:1},st:1,w0:8},
  pushdown:{n:'Разгибания на блоке',m:{triceps:1},st:2.5,w0:20},
  overhead_ext:{n:'Разгибания из-за головы',m:{triceps:1},st:2.5,w0:15},
  skull:{n:'Французский жим',m:{triceps:1},st:2.5,w0:15},
  squat:{n:'Приседания со штангой',m:{quads:1,glutes:1,lower:.5},c:1,st:2.5,w0:40},
  leg_press:{n:'Жим ногами',m:{quads:1,glutes:.5},st:10,w0:80},
  rdl:{n:'Румынская тяга',m:{hams:1,glutes:1,lower:1},c:1,st:2.5,w0:40},
  leg_curl:{n:'Сгибания ног',m:{hams:1},st:5,w0:30},
  calf:{n:'Подъёмы на носки',m:{calves:1},st:5,w0:40},
  leg_raise:{n:'Подъёмы ног в висе',m:{abs:1},bw:1,st:2.5,w0:0},
  cable_crunch:{n:'Скручивания на блоке',m:{abs:1},st:5,w0:30},
  run:{n:'Бег',m:{},run:1},
};
const P=(ex,sets,lo,hi,rest)=>({ex,sets,lo,hi,rest});
const OPEN=()=>[P('pullup',3,5,8,150),P('dips',3,6,10,150)];
const RUN=()=>P('run',1,0,0,0);
const PROGRAM=()=>[
  {name:'Грудь и спина',items:[...OPEN(),P('bench',3,6,10,180),P('cable_row',3,8,12,120),P('pec_deck',3,10,15,90),P('lat_pull',3,10,12,120),P('lateral',3,10,15,75),P('leg_raise',3,8,15,75),RUN()]},
  {name:'Ноги',items:[...OPEN(),P('squat',3,6,10,180),P('rdl',3,8,12,150),P('leg_press',3,10,15,120),P('leg_curl',3,10,15,90),P('calf',3,10,15,75),P('cable_crunch',3,10,15,75),RUN()]},
  {name:'Плечи и руки',items:[...OPEN(),P('ohp_db',3,8,12,150),P('ez_curl',3,8,12,90),P('pushdown',3,10,15,90),P('hammer',3,10,12,90),P('overhead_ext',3,10,15,90),P('lateral',3,12,20,60),P('face_pull',3,12,15,75),P('leg_raise',3,8,15,75),RUN()]},
  {name:'Верх: объём',items:[...OPEN(),P('incline_db',3,8,12,120),P('db_row',3,8,12,120),P('incline_curl',3,10,12,90),P('skull',3,8,12,90),P('rear_fly',3,12,15,75),P('lateral',3,12,20,60),P('cable_crunch',3,10,15,75),RUN()]},
];
const GOALS={mass:['Масса','Повторы 6–15, отдых по плану. Основной режим для набора.'],strength:['Сила','В базовых упражнениях 4–6 повторов и отдых на треть длиннее.'],cut:['Рельеф','Отдых на четверть короче, тренировка плотнее.']};
const FOCUS={none:['Без акцента',[]],arms:['Руки',['biceps','triceps']],chest:['Грудь',['chest']],back:['Спина',['lats','traps']],delts:['Плечи',['delts','rear']],legs:['Ноги',['quads','hams','glutes']]};
const BODY_GOAL=78, BODY0=71;

/* ================= состояние ================= */
const KEY='gym.v1';
const fresh=()=>({v:1,goal:'mass',focus:'arms',program:PROGRAM(),next:0,workouts:[],body:[],active:null,ui:{tab:'today'}});
let S=(()=>{try{const s=JSON.parse(localStorage.getItem(KEY));if(valid(s))return s}catch{}return fresh()})();
S.ui=S.ui||{tab:'today'};
function valid(s){return s&&s.v===1&&Array.isArray(s.workouts)&&Array.isArray(s.program)&&s.program.length>0&&Array.isArray(s.body)&&s.program.every(d=>d&&Array.isArray(d.items))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch{toast('Не удалось сохранить: память телефона заполнена')}}

/* ================= утилиты ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const num=x=>(Math.round(x*10)/10).toLocaleString('ru');
const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const day=t=>new Date(t).toLocaleDateString('ru',{day:'numeric',month:'short'});
const exn=id=>EX[id]?EX[id].n:esc(id);
const ex=id=>EX[id]||{n:id,m:{},st:2.5,w0:0};
const bodyKg=()=>S.body.length?S.body[S.body.length-1].kg:BODY0;
const plural=(n,a,b,c)=>{const m=n%100,k=n%10;return m>10&&m<20?c:k===1?a:k>1&&k<5?b:c};
const ago=t=>{const d=Math.floor((Date.now()-t)/864e5);return d<1?'сегодня':d===1?'вчера':d+' '+plural(d,'день','дня','дней')+' назад'};
const I={
  minus:'<svg class="ic" viewBox="0 0 24 24"><path d="M5 12h14"/></svg>',
  plus:'<svg class="ic" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg>',

/* ================= расчёты ================= */
// сравнимый показатель подхода: расчётный максимум (Эпли), для бега скорость
function metric(id,s){const e=ex(id);if(e.run)return s.min>0?s.km/(s.min/60):0;return ((e.bw?bodyKg():0)+(s.kg||0))*(1+s.reps/30)}
const best=(id,sets)=>Math.max(...sets.map(s=>metric(id,s)));
function hist(id,list=S.workouts){const r=[];for(const w of list)for(const it of w.items)if(it.ex===id&&it.sets.length)r.push({t:w.start,sets:it.sets,hi:it.hi});return r}
function fmtSet(id,s){const e=ex(id);if(e.run)return num(s.km)+' км за '+num(s.min)+' мин';if(e.bw)return (s.kg?'+'+num(s.kg)+'\u00a0кг\u00a0×\u00a0':'')+s.reps;return num(s.kg)+'\u00a0×\u00a0'+s.reps}
const fmtSets=(id,sets)=>sets.map(s=>fmtSet(id,s)).join(', ');
// двойная прогрессия: добрал верх диапазона во всех подходах → вес выше, иначе +1 повтор
function suggest(it,idx,today){
  const e=ex(it.ex);
  if(e.run){const h=hist(it.ex).pop();return h?{km:h.sets[0].km,min:h.sets[0].min}:{km:1.5,min:9.5}}
  if(today&&today.length){const p=today[today.length-1];return {kg:p.kg,reps:clamp(p.reps,it.lo,it.hi)}}
  const h=hist(it.ex).pop();
  if(!h)return {kg:e.w0||0,reps:it.lo,first:true};
  const kg=Math.max(...h.sets.map(s=>s.kg||0)),top=h.sets.filter(s=>(s.kg||0)===kg);
  if(h.sets.length>=it.sets&&h.sets.every(s=>s.reps>=it.hi&&(s.kg||0)===kg))return {kg:kg+e.st,reps:it.lo,up:true};
  if(top[0].reps<it.lo&&kg-e.st>=0&&!(e.bw&&kg===0))return {kg:kg-e.st,reps:it.lo,down:true};
  const prev=(h.sets[idx]||h.sets[h.sets.length-1]).reps;
  return {kg,reps:clamp(prev+1,it.lo,it.hi)};
}
function tune(it){
  const e=ex(it.ex);let {sets,lo,hi,rest}=it;if(e.run)return {...it};
  if(S.goal==='strength'&&e.c&&!e.bw){lo=4;hi=6;rest=Math.round(rest*1.35/15)*15}
  if(S.goal==='cut')rest=Math.round(rest*.75/15)*15;
  if((FOCUS[S.focus]||FOCUS.none)[1].some(m=>e.m[m]===1)&&!e.c)sets++;
  return {ex:it.ex,sets,lo,hi,rest};
}
const estMin=items=>Math.round((300+items.reduce((a,it)=>a+(ex(it.ex).run?720:it.sets*(45+it.rest)),0))/60);
function scoreOf(w,prevBest){
  const all=w.items.flatMap(i=>i.sets),vol=clamp(all.length/Math.max(1,w.planned));
  let res=0,n=0,known=0;
  for(const it of w.items){if(!it.sets.length)continue;const b=best(it.ex,it.sets),p=prevBest(it.ex);if(p!=null)known++;res+=p==null?.7:b>p*1.001?1:b>=p*.97?.65:.3;n++}
  res=n?res/n:0;
  const rs=all.filter(s=>s.plan>0&&s.rest!=null);
  const ratio=rs.length?rs.reduce((a,s)=>a+s.rest,0)/rs.reduce((a,s)=>a+s.plan,0):1;
  const pace=clamp(1-(ratio-1.15)/.85),min=(w.end-w.start)/6e4;
  const dur=min<45?clamp(min/45):min<=110?1:clamp(1-(min-110)/60);
  return {total:Math.round(vol*35+res*35+pace*15+dur*15),vol,res,pace,dur,ratio,min,first:!known};
}
const verdict=t=>t>=85?'Отличная':t>=70?'Хорошая':t>=50?'Нормальная':'Слабая';
const tonnage=w=>w.items.reduce((a,it)=>a+it.sets.reduce((b,s)=>b+(ex(it.ex).run?0:s.reps*((s.kg||0)+(ex(it.ex).bw?bodyKg():0))),0),0);
const setsOf=w=>w.items.reduce((a,it)=>a+it.sets.length,0);
function muscleSets(days){
  const from=Date.now()-days*864e5,r={};for(const m in MUS)r[m]=0;
  for(const w of S.workouts)if(w.start>=from)for(const it of w.items)for(const m in ex(it.ex).m)if(m in r)r[m]+=it.sets.length*ex(it.ex).m[m];
  for(const m in r)r[m]=r[m]/(days/7);return r;
}
function insights(){
  const out=[],W=S.workouts;if(!W.length)return out;
  const used=new Set(S.program.flatMap(d=>d.items.map(i=>i.ex)));
  for(const id of used){const h=hist(id);if(h.length<3||ex(id).run)continue;const b=h.slice(-3).map(x=>best(id,x.sets));
    if(b[1]<=b[0]*1.001&&b[2]<=b[0]*1.001)out.push(`<b>${exn(id)}</b> стоит на месте три тренировки. Сбрось вес на 10% и набирай повторы заново или замени упражнение в плане.`)}
  if(W.length>=4&&Date.now()-W[0].start>=12*864e5){const ms=muscleSets(14);
    const low=Object.keys(ms).filter(m=>ms[m]<6&&!['forearms','lower'].includes(m)).sort((a,b)=>ms[a]-ms[b]).slice(0,3);
    if(low.length)out.push(`Мало нагрузки: <b>${low.map(m=>MUS[m].toLowerCase()+' ('+num(ms[m])+')').join(', ')}</b> подходов в неделю при норме от 8. Добавь подход в плане.`);
    const high=Object.keys(ms).filter(m=>ms[m]>24);
    if(high.length)out.push(`Очень много нагрузки: <b>${high.map(m=>MUS[m].toLowerCase()).join(', ')}</b>, больше 24 подходов в неделю. Если не восстанавливаешься, убери подход.`)}
  const rec=W.slice(-3).filter(w=>w.score&&w.score.ratio>1.3);
  if(W.length>=3&&rec.length===3){const r=rec.reduce((a,w)=>a+w.score.ratio,0)/3;out.push(`Ты отдыхаешь на <b>${Math.round((r-1)*100)}%</b> дольше плана три тренировки подряд. Либо укладывайся, либо отдыха не хватает и стоит снизить вес.`)}
  const b=S.body.filter(x=>x.t>Date.now()-35*864e5);
  if(b.length>=2&&b[b.length-1].t-b[0].t>=10*864e5){const rate=(b[b.length-1].kg-b[0].kg)/((b[b.length-1].t-b[0].t)/6048e5);
    if(S.goal==='mass'&&rate<.15)out.push(`Вес тела не растёт (<b>${rate>=0?'+':''}${num(rate)} кг в неделю</b>). Для массы нужно +0,25–0,5: добавь около 300 ккал в день.`);
    else if(rate>.7)out.push(`Вес растёт слишком быстро (<b>+${num(rate)} кг в неделю</b>): лишнее уйдёт в жир. Убери около 200 ккал в день.`)}
  else if(!S.body.length||Date.now()-S.body[S.body.length-1].t>8*864e5)out.push('Запиши вес тела: по нему видно, хватает ли еды для роста. Взвешивайся раз в неделю утром.');
  const week=W.filter(w=>w.start>Date.now()-7*864e5).length;
  if(Date.now()-W[0].start>7*864e5&&week<3)out.push(`За последние 7 дней <b>${week} ${plural(week,'тренировка','тренировки','тренировок')}</b> из четырёх по плану.`);
  return out;
}

/* ================= графики ================= */
function chart(pts,kind,unit,span){
  if(!pts.length)return '';
  const W=340,H=150,pl=4,pr=46,pt=14,pb=22,vs=pts.map(p=>p.v);
  let lo=kind==='bar'?0:Math.min(...vs),hi=Math.max(...vs);if(hi-lo<1e-9){hi+=1;lo=Math.max(0,lo-1)}
  if(span&&hi-lo<span){const m=(hi+lo)/2;lo=m-span/2;hi=m+span/2}
  const pad=(hi-lo)*.15;hi+=pad;if(kind!=='bar')lo-=pad;
  const n=pts.length,slot=(W-pl-pr)/n,x=i=>pl+slot*(i+.5),y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="График: ${pts.map(p=>p.l+' '+num(p.v)).join(', ')} ${unit}">`;
  for(const g of [Math.max(...vs),Math.min(...vs)].filter((v,i,a)=>i===0||Math.abs(y(v)-y(a[0]))>=14))s+=`<path d="M${pl} ${y(g)}H${W-pr}" stroke="#d2d8dd" stroke-width="1"/><text x="${W-pr+6}" y="${y(g)+4}">${num(g)}</text>`;
  if(kind==='bar'){const bw=Math.min(28,slot-2);pts.forEach((p,i)=>{const t=y(p.v),h=Math.max(2,H-pb-t),r=Math.min(4,h);s+=`<path d="M${x(i)-bw/2} ${H-pb}v${-(h-r)}q0 ${-r} ${r} ${-r}h${bw-2*r}q${r} 0 ${r} ${r}v${h-r}z" fill="#b8432b"/>`})}
  else{s+=`<polyline points="${pts.map((p,i)=>x(i)+','+y(p.v)).join(' ')}" fill="none" stroke="#b8432b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach((p,i)=>s+=`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===n-1?5:3.5}" fill="#b8432b" stroke="#f1f4f6" stroke-width="2"/>`)}
  s+=`<path d="M${pl} ${H-pb}H${W-pr}" stroke="#15181a" stroke-width="1"/><text x="${pl}" y="${H-6}">${pts[0].l}</text>`;
  if(n>1)s+=`<text x="${W-pr}" y="${H-6}" text-anchor="end">${pts[n-1].l}</text>`;
  pts.forEach((p,i)=>s+=`<rect x="${pl+slot*i}" y="0" width="${slot}" height="${H}" fill="transparent" data-a="tip" data-t="${esc(p.l+': '+num(p.v)+' '+unit+(p.x?' · '+p.x:''))}"/>`);
  const l=pts[n-1];
  return `<div class="chart">${s}</svg><p class="tip">${esc(l.l+': '+num(l.v)+' '+unit+(l.x?' · '+l.x:''))}</p></div>`;
}

  const r=(m,x,y,w,h,rx)=>`<rect fill="${col(m)}" x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}"/><rect fill="${col(m)}" x="${120-x-w}" y="${y}" width="${w}" height="${h}" rx="${rx}"/>`;

    r('chest',37.5,42,21.5,21,7)+r('biceps',20,61,13,27,6.5)+`<rect fill="${col('abs')}" x="47" y="67" width="26" height="42" rx="8"/><path d="M60 69v38M49 80h22M49 93h22" stroke="#e2e7ea" stroke-width="1.6"/>`+r('quads',39.5,121,18,54,9);
  const rear=`<rect fill="${col('traps')}" x="41" y="33" width="38" height="17" rx="8"/><rect fill="${col('traps')}" x="53" y="52" width="14" height="24" rx="6"/><ellipse fill="${col('rear')}" cx="27" cy="48" rx="8.5" ry="10"/><ellipse fill="${col('rear')}" cx="93" cy="48" rx="8.5" ry="10"/>`+
    r('lats',37,54,14,40,7)+`<rect fill="${col('lower')}" x="51" y="98" width="18" height="12" rx="5"/>`+r('triceps',20,61,13,27,6.5)+r('glutes',39.5,113,19.5,21,9)+r('hams',39.5,137,18,39,9);
  return `<figure><svg viewBox="0 0 120 240" role="img" aria-label="${back?'Вид сзади':'Вид спереди'}">${base}${common}${back?rear:front}</svg><figcaption>${back?'Сзади':'Спереди'}</figcaption></figure>`;

/* ================= полоса тренировки ================= */
function strip(sets,live,remain){
  let s='';
  for(const x of sets){s+=`<i style="flex:${Math.max(8,x.work||8)}"></i>`;
    if(x.rest!=null){const ok=Math.min(x.rest,x.plan||x.rest),ov=x.rest-ok;if(ok>0)s+=`<i class="r" style="flex:${ok}"></i>`;if(ov>1)s+=`<i class="o" style="flex:${ov}"></i>`}}
  if(live)s+=`<i id="live" class="${live.c}" style="flex:${Math.max(4,live.v)}"></i>`+(live.c==='r'?'<i id="liveo" class="o" style="flex:0;min-width:0"></i>':'');
  if(remain>0)s+=`<i class="n" style="flex:${remain}"></i>`;
  return `<div class="strip" aria-hidden="true">${s}</div>`;
}
const LEGEND='<div class="legend"><span>подход</span><span class="r">отдых</span><span class="o">переотдых</span></div>';

/* ================= экраны ================= */
const app=$('#app');
function draft(){
  const d=S.ui.day??S.next%S.program.length;
  if(!S.ui.draft||S.ui.draft.day!==d||S.ui.draft.key!==S.goal+S.focus)S.ui.draft={day:d,key:S.goal+S.focus,items:S.program[d].items.map(tune)};
  return S.ui.draft;
}
const listOf=ctx=>ctx==='draft'?draft().items:S.program[+ctx].items;
function planRows(items,ctx,edit){
  return '<ul class="rows">'+items.map((it,i)=>{
    const e=ex(it.ex),sg=suggest(it,0);
    const v=e.run?(hist(it.ex).length?num(sg.km)+' км':'10–15 мин'):`${it.sets} × ${it.lo}–${it.hi}`+(ctx==='draft'&&(sg.kg||!e.bw)?` · <span class="${sg.up?'up':''}">${e.bw?'+':''}${num(sg.kg)} кг${sg.up?' '+I.up.replace('class="ic"','class="ic" style="display:inline;width:16px;height:16px;vertical-align:-2px"'):''}</span>`:'');
    let h=`<li><div class="row"><b>${exn(it.ex)}</b><span class="v">${v}</span></div>`;
    if(edit){const alts=Object.keys(EX).filter(k=>k!==it.ex&&!EX[k].run&&Object.keys(e.m).some(m=>e.m[m]===1&&EX[k].m[m]===1));
      h+=`<div class="ed"><button class="sq" data-a="mv" data-ctx="${ctx}" data-i="${i}" data-d="-1" aria-label="Выше">${I.up}</button><button class="sq" data-a="mv" data-ctx="${ctx}" data-i="${i}" data-d="1" aria-label="Ниже">${I.down}</button>`+
      (e.run?'':`<button class="sq" data-a="nsets" data-ctx="${ctx}" data-i="${i}" data-d="-1" aria-label="Меньше подходов">${I.minus}</button><span class="n">${it.sets} ${plural(it.sets,'подход','подхода','подходов')}</span><button class="sq" data-a="nsets" data-ctx="${ctx}" data-i="${i}" data-d="1" aria-label="Больше подходов">${I.plus}</button>`)+
      `<button class="sq" data-a="rm" data-ctx="${ctx}" data-i="${i}" aria-label="Убрать ${exn(it.ex)}">${I.x}</button>`+

    return h+'</li>'}).join('')+'</ul>'+
    (edit?`<div class="btns"><select data-c="add" data-ctx="${ctx}" aria-label="Добавить упражнение"><option value="">Добавить упражнение…</option>${Object.keys(EX).filter(k=>!items.some(i=>i.ex===k)).map(k=>`<option value="${k}">${EX[k].n}</option>`).join('')}</select></div>`:'');
}

dlg.addEventListener('close',()=>{if(dlg.returnValue==='ok'&&$('#wkg')){const v=parseFloat($('#wkg').value.replace(',','.'));if(v>30&&v<250){S.body.push({t:Date.now(),kg:Math.round(v*10)/10});save();render(true);toast('Вес записан')}else toast('Вес должен быть числом в килограммах')}dlg.returnValue=''});
document.addEventListener('focusin',e=>{if(e.target.matches('.stp input'))e.target.select()});

/* ================= самопроверка: открой index.html#test ================= */
function selftest(){
  const keep=S,ok=(c,m)=>{if(!c)throw new Error('selftest: '+m)};
  S=fresh();const it=P('bench',3,6,10,180);
  ok(suggest(it,0).kg===40&&suggest(it,0).first,'старт с w0');
  S.workouts=[{id:1,start:1,end:36e5,name:'t',planned:3,items:[{ex:'bench',lo:6,hi:10,sets:[{reps:10,kg:40},{reps:10,kg:40},{reps:10,kg:40}]}]}];
  ok(suggest(it,0).kg===42.5&&suggest(it,0).reps===6,'верх диапазона → вес выше');
  S.workouts[0].items[0].sets[2].reps=7;
  ok(suggest(it,2).kg===40&&suggest(it,2).reps===8,'иначе +1 повтор');
  S.workouts[0].items[0].sets=[{reps:4,kg:40}];ok(suggest(it,0).kg===37.5,'ниже диапазона → вес ниже');
  const w={start:0,end:80*6e4,planned:4,items:[{ex:'bench',sets:[{reps:8,kg:40,rest:180,plan:180},{reps:8,kg:40,rest:180,plan:180}]}]};
  const sc=scoreOf(w,()=>null);ok(sc.vol===.5&&sc.pace===1&&sc.dur===1&&sc.total===Math.round(17.5+24.5+30),'оценка');
  ok(scoreOf(w,()=>1).res===1&&scoreOf(w,()=>1e4).res===.3,'результат к прошлому разу');
  ok(mmss(125)==='2:05'&&plural(3,'а','б','в')==='б','формат');
  S=keep;console.log('selftest ok');document.title='selftest ok';
}
if(location.hash==='#test')selftest();
